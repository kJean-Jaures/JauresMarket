<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — JAURESMARKET</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body class="admin-body"><header class="header"><a class="brand" href="/">JAURESMARKET<span class="admin-label">ADMINISTRATION</span></a><a href="/">Voir la boutique ↗</a></header><main class="admin-main"><section id="login-panel" class="login-panel"><p class="eyebrow">ESPACE BOUTIQUE</p><h1>Bienvenue chez toi.</h1><p>Connecte-toi pour gérer tes articles.</p><form id="login-form"><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button class="button blue">Se connecter →</button></form><p id="login-error" role="alert" class="error"></p></section><section id="dashboard" hidden><div class="section-top"><div><p class="eyebrow">ESPACE BOUTIQUE</p><h1>Mes articles</h1><p id="admin-count" class="muted"></p></div><div class="admin-actions"><button id="new-product" class="button blue">+ Ajouter un article</button><button id="logout" class="button outline">Déconnexion</button></div></div><p id="admin-status" role="status"></p><label class="search"><input id="admin-search" type="search" placeholder="Rechercher dans mes articles" aria-label="Rechercher dans mes articles"></label><div id="admin-products" class="admin-products"></div></section></main><dialog id="editor"><div class="dialog-heading"><h2 id="editor-title">Ajouter un article</h2><button id="editor-close" class="close-inline" aria-label="Fermer">×</button></div><form id="product-form"><label>Nom de l’article<input name="name" maxlength="120" required></label><div class="form-grid"><label>Catégorie<select name="category" required><option>Homme</option><option>Femme</option><option>Pagnes & tissus</option><option>Sous-vêtements</option><option>Chaussures</option><option>Accessoires</option></select></label><label>Prix en FCFA<input name="price" type="number" min="0" max="9007199254740991" step="1" required></label><label>Stock total disponible<input name="stock" type="number" min="0" max="9007199254740991" step="1" required></label><label>Tailles, séparées par des virgules<input name="sizes" placeholder="S, M, L, XL" maxlength="200"></label></div><label>Couleurs, séparées par des virgules<input name="colors" placeholder="Noir, Blanc, Bleu" maxlength="200"></label><label>Description et détails<textarea name="description" rows="4" maxlength="3000" placeholder="Matière, coupe, mesures, entretien…"></textarea></label><label>Photo de l’article · JPG, PNG ou WebP · 6 Mo maximum<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="image-preview" class="image-preview" alt="Aperçu de la photo" hidden><button id="remove-image" type="button" class="text-link">Retirer la photo</button><label class="checkbox"><input name="active" type="checkbox" checked> Article visible dans la boutique</label><p class="muted">Un stock à zéro affiche « Épuisé ». Les tailles et couleurs sont des choix ; le stock est commun à l’article.</p><p id="form-error" class="error" role="alert"></p><button id="save-product" class="button blue full">Enregistrer l’article</button></form></dialog></body></html>
